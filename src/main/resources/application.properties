# ===============================
# Server & Port Binding (Fixes Render "Port Scan Timeout")
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# Database Configuration (TiDB Cloud)
# ===============================
# Ensure Render SPRING_DATASOURCE_URL has "ap-southeast-1" (with hyphens)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Optimization (Speeds up startup)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Prevents Hibernate from hanging during metadata lookup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===============================
# Groq Configuration (OpenAI-Compatible)
# ===============================
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# ===============================
# CORS Configuration (Updated for your Vercel URL)
# ===============================
# This allows your Vercel frontend to successfully call your Render backend
cors.allowed-origins=https://spring-ai-chat-capb.vercel.app

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=INFO
logging.level.com.example.springaichat=INFO
