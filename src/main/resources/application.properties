# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# Database Configuration (TiDB Cloud)
# ===============================
# CRITICAL: Ensure your SPRING_DATASOURCE_URL in Render starts with jdbc:mysql:// and ends with SSL params
# Example: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/YOUR_DB_NAME?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Changed from org.postgresql.Driver to MySQL/TiDB compatible driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
# TiDB is compatible with MySQL 8 syntax
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Groq Configuration (OpenAI-Compatible)
# ===============================
# Added /v1 to the base-url to ensure Spring AI handshake works correctly
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Model Selection: llama-3.3-70b-versatile
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# ===============================
# CORS & Security
# ===============================
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.ai=INFO
logging.level.com.example.springaichat=INFO
# Useful for debugging connection issues during initial setup
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
